# Prose lint for the documentation set.
#
# Vale is not a code linter, and this repository has none on purpose: see
# "Code conventions" in CONTRIBUTING.md. It runs as its own CI job over docs/
# because its only job here is the one thing a structural check cannot do --
# keep the retired vocabulary of docs/design/00-terminology.md section 10 out of
# new prose. Structure, cross-references and the bilingual mirror are checked by
# scripts/check-docs.mjs, which needs no binary.
#
# The rules are enabled on the four operative design documents and disabled where
# a retired word is the subject rather than a usage:
#
#   docs/design/00-terminology.md   defines each retired word in a heading
#   docs/design/01-overview.md      argues against "background task" by name and
#                                   quotes the false rule it retired verbatim
#   docs/implementation-notes.md    quotes test titles and the 0.2.0 changelog
#   docs/design/05-durability-and-containment.md  is the document whose whole
#                                   subject is translating Pi Durable's park
#
# The rules carry English tokens only. The zh-CN mirror is kept honest by the
# structural parity check in scripts/check-docs.mjs, which pairs every heading,
# table and identifier with its English counterpart.

StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = PiAsyncShell

[docs/design/00-terminology.md]
PiAsyncShell.RetiredTerms = NO
PiAsyncShell.BorrowedTerms = NO

[docs/design/zh-CN/00-terminology.md]
PiAsyncShell.RetiredTerms = NO
PiAsyncShell.BorrowedTerms = NO

[docs/design/01-overview.md]
PiAsyncShell.RetiredTerms = NO
PiAsyncShell.BorrowedTerms = NO

[docs/design/zh-CN/01-overview.md]
PiAsyncShell.RetiredTerms = NO
PiAsyncShell.BorrowedTerms = NO

[docs/design/05-durability-and-containment.md]
PiAsyncShell.BorrowedTerms = NO

[docs/design/zh-CN/05-durability-and-containment.md]
PiAsyncShell.BorrowedTerms = NO

[docs/implementation-notes.md]
PiAsyncShell.RetiredTerms = NO
PiAsyncShell.BorrowedTerms = NO
