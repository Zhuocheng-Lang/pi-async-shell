# A word this project borrows from another product to explain a difference.
#
# "park" is Pi Durable's suspended-call mechanism. docs/design/05-durability-and-containment.md
# section 1 borrows it to say exactly what pi-async-shell does instead, so the
# word is allowed. It is a warning rather than an error because a legitimate
# comparison and a mistaken design term look the same to a linter, and only a
# reader can tell them apart.
extends: existence
message: "'park' is Pi Durable's mechanism, not this project's. Ending the turn is the local form; say so when a reader could read 'park' as ours."
level: warning
ignorecase: true
scope: text
tokens:
  - '\bparks?\b'
