name: Publish

# Publishes to npm from a tag, and only from a tag: the version in
# package.json must match the tag, so a push is the release decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: dist-tag to publish under
        required: true
        default: latest

permissions:
  contents: read
  # Lets the runner mint an OIDC token. npm Trusted Publishing exchanges it for
  # a short-lived publish token, so no long-lived secret is stored here.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Trusted Publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      # 26 carries npm 12 and a Node above the engines floor. The publish itself
      # is pnpm, but both tools must understand the registry metadata.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          # Writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the
          # runner's .npmrc, which is how the fallback token reaches pnpm.
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v$version" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          }

      # A tag is not pushed once. Rewriting the history moves the objects a tag
      # points at, and GitHub reports the moved tag as a fresh push, so this job
      # runs again for a version the registry already holds. The registry
      # answers a second upload of one version with a 403, which reads as a
      # broken pipeline for a release that already shipped. The version decides
      # instead: a version on the registry is a no-op, and a missing one is
      # the upload.
      #
      # The registry is read over HTTPS rather than through npm, so the answer
      # does not depend on which credential the runner happens to hold.
      - name: Look the version up in the registry
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/$name/$version")
          case "$code" in
            200)
              echo "$name@$version is already published"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "$name@$version is not on the registry yet"
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "the registry answered HTTP $code for $name@$version"
              exit 1
              ;;
          esac

      # prepublishOnly runs pnpm verify, so the suite gates the upload itself.
      # --no-git-checks: a tag checkout is a detached HEAD, which pnpm refuses
      # by default; --tag is explicit because publishConfig.tag is not honoured
      # by pnpm and the workflow should not depend on the default.
      #
      # Two credentials are accepted. A configured npm Trusted Publisher wins,
      # because the CLI prefers the OIDC token when the environment offers one.
      # Without it, the NPM_TOKEN secret is the fallback, so the pipeline works
      # before that web configuration exists.
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: pnpm publish --no-git-checks --tag "${{ inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
