# The vendor field is its own workspace so its lockfile stays independent of
# the root one. pnpm reads settings from this file (pnpm >= 10.13).
minimumReleaseAgeExclude:
  - '@tduyng/pi-shell@0.0.6'
  - pi-async@0.4.4

# Dependency install scripts are denied unless allowed here. Denying them
# explicitly keeps `pnpm install` non-interactive and stops strictDepBuilds,
# which defaults to true, from failing the install with ERR_PNPM_IGNORED_BUILDS.
#
# @homebridge/node-pty-prebuilt-multiarch is denied on purpose, not by
# oversight: bench/REPORT.md was produced without its native binding, and
# enabling the build would change what the shell-jobs row measures. Flip it to
# true and regenerate the report together, never one without the other.
allowBuilds:
  '@google/genai': false
  '@homebridge/node-pty-prebuilt-multiarch': false
  protobufjs: false

# pi-exec-command@0.3.10 publishes three of its bundled packages as
# `file:../<name>` dependencies. pnpm >= 11.29 refuses a local specifier
# declared by a non-local package (ERR_PNPM_LOCAL_SUBDEP_NOT_ALLOWED), and the
# published manifest is what pnpm reads, so the install cannot proceed without a
# rewrite. Each override names the exact version the tarball bundles, so the
# installed code is the same as the bundled copy the earlier reports measured;
# it is fetched from the registry instead of taken out of the archive.
overrides:
  'pi-exec-command>@luan.sh/pi-libactions': '@luan.sh/pi-libactions@0.3.4'
  'pi-exec-command>@luan.sh/pi-libtui': '@luan.sh/pi-libtui@0.3.15'
  'pi-exec-command>@luan.sh/pi-xsettings': '@luan.sh/pi-xsettings@0.3.7'
